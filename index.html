<!DOCTYPE html>
<html>
<head>
<title>Idle Siłownia</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(120deg, #141e30, #243b55);
    color: white;
    text-align: center;
    padding-top: 40px;
}

h1 {
    font-size: 40px;
}

.box {
    background: rgba(255,255,255,0.08);
    width: 320px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    backdrop-filter: blur(6px);
}

.btn {
    padding: 12px 20px;
    margin: 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    font-weight: bold;
    background: #00ff99;
}

.btn:hover {
    transform: scale(1.05);
}

.shop-btn {
    width: 100%;
    margin-top: 10px;
}
</style>
</head>

<body>

<h1>🏋️ Idle Siłownia</h1>

<div class="box">
    <h2>💪 Siła</h2>
    <h1 id="power">0</h1>

    <button class="btn" onclick="train()">Trenuj 💥</button>
</div>

<div class="box">
    <h2>🛒 Sklep</h2>

    <button class="btn shop-btn" onclick="buyUpgrade()">
        Hantle (+1 za klik) - koszt: <span id="cost">10</span>
    </button>

    <p>Siła / klik: <span id="perClick">1</span></p>
</div>

<script>
let power = 0;
let perClick = 1;
let cost = 10;

function update() {
    document.getElementById("power").innerText = power;
    document.getElementById("perClick").innerText = perClick;
    document.getElementById("cost").innerText = cost;
}

function train() {
    power += perClick;
    update();
}

function buyUpgrade() {
    if (power >= cost) {
        power -= cost;
        perClick += 1;
        cost = Math.floor(cost * 1.5);
        update();
    } else {
        alert("Za mało siły 💀");
    }
}

update();
</script>

</body>
</html>
