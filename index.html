<!DOCTYPE html>
<html>
<head>
<title>Neon Gym RPG Full</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;

    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}

.top {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    text-align: center;
    padding: 10px;
    border-bottom: 2px solid #ffcc00;
    z-index: 100;
}

.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,204,0,0.3);
    width: 360px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 15px;
}

button {
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
}

button:active {
    transform: scale(0.95);
}

.particle {
    position: absolute;
    animation: floatUp 0.6s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120px); opacity: 0; }
}

.bar {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
}
</style>
</head>

<body>

<div class="top">
💪 POWER: <span id="power">0</span> |
⚡ LEVEL: <span id="level">1</span> |
🧟 BOSS: <span id="bossName">Slime</span>
</div>

<br><br><br>

<div class="card">
    <h2>🏋️ TRENING</h2>
    <button onclick="train(event)">KLIK 💥</button>
    <p>DMG: <span id="dmg">1</span></p>
</div>

<div class="card">
    <h2>🧟 BOSS</h2>
    <div class="bar"><div class="fill" id="bossBar"></div></div>
    <p>HP: <span id="bossHp">50</span></p>
</div>

<div class="card">
    <h2>🎒 INVENTORY</h2>
    <p id="inv">Brak itemów</p>
</div>

<div class="card">
    <h2>🏆 ACHIEVEMENTS</h2>
    <p id="ach">None</p>
</div>

<script>

/* STATE */
let power = 0;
let level = 1;
let dmg = 1;

let boss = {
    name: "Slime",
    hp: 50,
    max: 50
};

let inventory = [];
let achievements = [];

let combo = 0;
let lastClick = 0;

/* BOSSES */
let bosses = [
    {name:"Slime", hp:50},
    {name:"Gym Goblin", hp:120},
    {name:"Protein Demon", hp:300}
];

/* PARTICLE */
function particle(x,y,text){
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = text;
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),600);
}

/* TRAIN */
function train(e){

    let now = Date.now();

    if(now - lastClick < 500){
        combo++;
    } else combo = 1;

    lastClick = now;

    let gain = dmg + Math.floor(combo/3);

    boss.hp -= gain;
    power += gain;

    particle(e.clientX, e.clientY, "💥+"+gain);

    if(boss.hp <= 0){
        nextBoss();
    }

    checkAchievements();

    update();
}

/* NEXT BOSS */
function nextBoss(){
    let idx = Math.floor(Math.random()*bosses.length);
    boss = {
        name: bosses[idx].name,
        hp: bosses[idx].hp,
        max: bosses[idx].hp
    };

    level++;
    dmg++;

    let drop = loot();
    inventory.push(drop);

    alert("BOSS DOWN 💀 DROP: " + drop);
}

/* LOOT SYSTEM */
function loot(){
    let items = [
        "🥤 Protein +1 DMG",
        "🧤 Gloves +2 DMG",
        "💊 Rage Boost +3 DMG",
        "🔥 Legendary Belt +5 DMG"
    ];

    let item = items[Math.floor(Math.random()*items.length)];

    if(item.includes("+1")) dmg += 1;
    if(item.includes("+2")) dmg += 2;
    if(item.includes("+3")) dmg += 3;
    if(item.includes("+5")) dmg += 5;

    return item;
}

/* ACHIEVEMENTS */
function checkAchievements(){
    if(power > 50 && !achievements.includes("💪 Starter")){
        achievements.push("💪 Starter");
    }

    if(level >= 3 && !achievements.includes("👑 Grinder")){
        achievements.push("👑 Grinder");
    }
}

/* UPDATE */
function update(){

    document.getElementById("power").innerText = power;
    document.getElementById("level").innerText = level;
    document.getElementById("dmg").innerText = dmg;

    document.getElementById("bossName").innerText = boss.name;
    document.getElementById("bossHp").innerText = boss.hp;

    let percent = (boss.hp / boss.max) * 100;
    document.getElementById("bossBar").style.width = percent + "%";

    document.getElementById("inv").innerText =
        inventory.length ? inventory.join(", ") : "Brak itemów";

    document.getElementById("ach").innerText =
        achievements.length ? achievements.join(", ") : "None";
}

update();

</script>

</body>
</html>
