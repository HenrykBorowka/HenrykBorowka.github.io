<!DOCTYPE html>
<html>
<head>
<title>Neon Gym RPG</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
}

/* MENU */
.menu {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    background: rgba(0,0,0,0.9);
    padding: 10px;
    border-bottom: 2px solid #ffcc00;
}

.menu button {
    background: none;
    border: none;
    color: #ffcc00;
    font-weight: bold;
    cursor: pointer;
}

/* SECTIONS */
.page {
    display: none;
    padding-top: 80px;
    text-align: center;
}

.active { display: block; }

/* CARDS */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,204,0,0.3);
    width: 340px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 15px;
}

/* BUTTONS */
.btn {
    padding: 10px 18px;
    border: none;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
    cursor: pointer;
    font-weight: bold;
    border-radius: 10px;
}

/* PARTICLE */
.particle {
    position: absolute;
    color: #ffcc00;
    font-size: 18px;
    animation: floatUp 0.8s ease-out forwards;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-80px); opacity: 0; }
}
</style>
</head>

<body>

<div class="menu">
    <button onclick="show('home')">Start</button>
    <button onclick="show('game')">Gra</button>
    <button onclick="show('inventory')">Ekwipunek</button>
    <button onclick="show('boss')">Boss</button>
    <button onclick="show('quests')">Questy</button>
    <button onclick="show('rank')">Ranking</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
    <h1>🏋️ NEON GYM RPG</h1>

    <div class="card">
        <p>Trenuj, bij bossy, zbieraj itemy 💀</p>
    </div>
</div>

<!-- GAME -->
<div id="game" class="page">

    <h1>💪 TRENING</h1>

    <div class="card">
        <h2>Siła: <span id="power">0</span></h2>
        <button class="btn" onclick="train(event)">TRENUJ 🔥</button>
    </div>

    <div class="card">
        <h3>XP: <span id="xp">0</span></h3>
        <h3>Level: <span id="level">1</span></h3>
    </div>
</div>

<!-- INVENTORY -->
<div id="inventory" class="page">

    <h1>🎒 EKWIPUNEK</h1>

    <div class="card">
        <p id="items">Brak itemów</p>
    </div>

</div>

<!-- BOSS -->
<div id="boss" class="page">

    <h1>👹 BOSS</h1>

    <div class="card">
        <h3>Shadow Gym Boss</h3>
        <p>HP: <span id="bosshp">50</span></p>
        <button class="btn" onclick="fight()">ATAK 💥</button>
    </div>

</div>

<!-- QUESTS -->
<div id="quests" class="page">

    <h1>📜 QUESTY</h1>

    <div class="card">
        <p>✔ Zrób 10 treningów (0/10)</p>
        <p>✔ Pokonaj bossa</p>
    </div>

</div>

<!-- RANKING -->
<div id="rank" class="page">

    <h1>📈 RANKING</h1>

    <div class="card">
        <p>1. Ty - <span id="score">0</span> pkt</p>
        <p>2. NPC - 9999 pkt</p>
        <p>3. Bot - 5000 pkt</p>
    </div>

</div>

<script>

/* STATE */
let power = 0;
let xp = 0;
let level = 1;
let bossHp = 50;
let items = [];
let score = 0;

/* LOAD */
let save = JSON.parse(localStorage.getItem("gymRPG"));
if(save){
    Object.assign(window, save);
}

/* SAVE */
function saveGame(){
    localStorage.setItem("gymRPG", JSON.stringify({
        power, xp, level, bossHp, items, score
    }));
}

/* NAV */
function show(id){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* PARTICLES */
function particle(x,y){
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = "💥";
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),800);
}

/* TRAIN */
function train(e){
    power++;
    xp++;
    score++;

    particle(e.clientX, e.clientY);

    if(xp >= level * 5){
        xp = 0;
        level++;
        dropItem();
    }

    update();
    saveGame();
}

/* DROP ITEM */
function dropItem(){
    let drops = ["🥤 Białko", "🧤 Rękawice", "💊 Boost"];
    let item = drops[Math.floor(Math.random()*drops.length)];
    items.push(item);
}

/* BOSS FIGHT */
function fight(){
    bossHp -= power > 0 ? power : 1;

    if(bossHp <= 0){
        alert("Boss pokonany 💀🔥");
        bossHp = 100;
        dropItem();
    }

    update();
    saveGame();
}

/* UPDATE */
function update(){
    document.getElementById("power").innerText = power;
    document.getElementById("xp").innerText = xp;
    document.getElementById("level").innerText = level;
    document.getElementById("bosshp").innerText = bossHp;
    document.getElementById("score").innerText = score;

    document.getElementById("items").innerText =
        items.length ? items.join(", ") : "Brak itemów";
}

update();

</script>

</body>
</html>
