<!DOCTYPE html>
<html>
<head>
    <title>Moja strona</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            color: white;
            text-align: center;
            padding-top: 60px;
        }

        /* MENU */
        .menu {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            padding: 10px;
        }

        .menu a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        .menu a:hover {
            color: #00ff99;
        }

        h1 {
            font-size: 45px;
            margin-top: 30px;
        }

        .box {
            margin: 30px auto;
            width: 320px;
            padding: 20px;
            background: rgba(255,255,255,0.1);
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }

        .btn {
            display: inline-block;
            margin-top: 15px;
            padding: 12px 25px;
            background: #00ff99;
            color: black;
            font-weight: bold;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            transform: scale(1.1);
            background: #00cc77;
        }

        .big-btn {
            padding: 15px 30px;
            font-size: 18px;
        }
    </style>
</head>

<body>

<!-- MENU -->
<div class="menu">
    <a href="#start">Start</a>
    <a href="#gra">Gra</a>
    <a href="#kontakt">Kontakt</a>
</div>

<!-- START -->
<div id="start" class="box">
    <h1>Siema 😎</h1>
    <p>Twoja pierwsza normalna strona</p>
</div>

<!-- MINI GRA -->
<div id="gra" class="box">
    <h2>🎮 Mini gra</h2>

    <button class="btn big-btn" onclick="kliknij()">Kliknij mnie</button>

    <p>Wynik:</p>
    <h2 id="wynik">0</h2>

    <button class="btn" onclick="reset()">Reset</button>
</div>

<!-- KONTAKT -->
<div id="kontakt" class="box">
    <h2>Kontakt</h2>
    <p>Tu możesz coś wpisać</p>
    <p>📞 123 456 789</p>
</div>

<script>
let licznik = 0;

function kliknij() {
    licznik++;
    document.getElementById("wynik").innerHTML = licznik;
}

function reset() {
    licznik = 0;
    document.getElementById("wynik").innerHTML = licznik;
}
</script>

</body>
</html>
