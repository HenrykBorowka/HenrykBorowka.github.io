
<!DOCTYPE html>
<html>
<head>
<title>Neon Gym Brawl Edition</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
    user-select: none;
    overflow-x: hidden;
}

/* MENU */
.menu {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    background: rgba(0,0,0,0.9);
    padding: 10px;
    border-bottom: 2px solid #ffcc00;
    z-index: 100;
}

.menu button {
    background: none;
    border: none;
    color: #ffcc00;
    font-weight: bold;
    cursor: pointer;
}

/* PAGES */
.page {
    display: none;
    padding-top: 80px;
    text-align: center;
}

.active { display: block; }

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,204,0,0.3);
    width: 340px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 15px;
}

/* BUTTON */
.btn {
    padding: 12px 20px;
    border: none;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
    cursor: pointer;
    font-weight: bold;
    border-radius: 10px;
    margin: 5px;
}

/* PARTICLES */
.particle {
    position: absolute;
    font-size: 20px;
    animation: floatUp 0.7s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-100px); opacity: 0; }
}

/* SHAKE */
.shake {
    animation: shake 0.2s;
}

@keyframes shake {
    0% { transform: translate(0,0); }
    25% { transform: translate(5px,5px); }
    50% { transform: translate(-5px,5px); }
    75% { transform: translate(5px,-5px); }
    100% { transform: translate(0,0); }
}
</style>
</head>

<body>

<div class="menu">
    <button onclick="show('game')">Gra</button>
</div>

<!-- GAME -->
<div id="game" class="page active">

    <h1>💪 NEON GYM BRAWL</h1>

    <div class="card">
        <h2>Siła: <span id="power">0</span></h2>
        <h3>Combo: <span id="combo">0</span> 🔥</h3>

        <button class="btn" onclick="train(event)">TRENUJ 💥</button>
    </div>

</div>

<!-- AUDIO -->
<audio id="hitSound" src="https://www.myinstants.com/media/sounds/punch.mp3"></audio>

<script>

/* STATE */
let power = 0;
let combo = 0;
let lastClick = 0;

/* UPDATE */
function update(){
    document.getElementById("power").innerText = power;
    document.getElementById("combo").innerText = combo;
}

/* SHAKE */
function shake(){
    document.body.classList.add("shake");
    setTimeout(()=>document.body.classList.remove("shake"),200);
}

/* PARTICLE */
function particle(x,y,text){
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = text;
    p.style.left = x + "px";
    p.style.top = y + "px";
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),700);
}

/* SOUND */
function playSound(){
    let s = document.getElementById("hitSound");
    s.currentTime = 0;
    s.play();
}

/* TRAIN */
function train(e){

    let now = Date.now();

    // combo system
    if(now - lastClick < 700){
        combo++;
    } else {
        combo = 1;
    }

    lastClick = now;

    let gain = 1 + Math.floor(combo / 3);

    power += gain;

    // effects
    particle(e.clientX, e.clientY, "💥+" + gain);
    shake();
    playSound();

    update();
}

/* NAV */
function show(id){
    document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

update();

</script>

</body>
</html>
