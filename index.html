
<!DOCTYPE html>
<html>
<head>
<title>Neon Gym Ultra Fixed</title>

<style>

/* GLOBAL FIX (NO SELECTION / NO BUGS) */
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;

    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    -webkit-tap-highlight-color: transparent;
    overflow-x: hidden;
}

* {
    -webkit-tap-highlight-color: transparent;
}

/* TOP */
.top {
    position: fixed;
    top: 0;
    width: 100%;
    text-align: center;
    padding: 10px;
    background: rgba(0,0,0,0.85);
    border-bottom: 2px solid #ffcc00;
    z-index: 100;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,204,0,0.3);
    width: 340px;
    margin: 20px auto;
    padding: 15px;
    border-radius: 15px;
}

/* BUTTON */
button {
    user-select: none;
    -webkit-user-select: none;
    -ms-user-select: none;
    outline: none;
    cursor: pointer;
    touch-action: manipulation;
}

.btn {
    padding: 12px 20px;
    border: none;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
    cursor: pointer;
    font-weight: bold;
    border-radius: 10px;
}

/* CLICK FEEL */
button:active {
    transform: scale(0.95);
}

/* PARTICLES */
.particle {
    position: absolute;
    font-size: 18px;
    animation: floatUp 0.6s ease-out forwards;
    pointer-events: none;
}

@keyframes floatUp {
    from { transform: translateY(0); opacity: 1; }
    to { transform: translateY(-120px); opacity: 0; }
}

</style>
</head>

<body>

<div class="top">
💪 NEON GYM ULTRA | Power: <span id="power">0</span> | Combo: <span id="combo">0</span> | Boss: <span id="boss">100</span>
</div>

<br><br><br>

<div class="card">
    <h2>🏋️ TRENING</h2>
    <button class="btn" onclick="train(event)">KLIKNIJ 💥</button>
</div>

<div class="card">
    <h2>👹 BOSS</h2>
    <p>HP: <span id="bossHp">100</span></p>
</div>

<audio id="hit" src="https://www.myinstants.com/media/sounds/punch.mp3"></audio>

<script>

/* STATE */
let power = 0;
let combo = 0;
let lastClick = 0;

let boss = 100;

/* UPDATE */
function update(){
    document.getElementById("power").innerText = power;
    document.getElementById("combo").innerText = combo;
    document.getElementById("boss").innerText = boss;
    document.getElementById("bossHp").innerText = boss;
}

/* SHAKE (IMPROVED) */
function shake(){
    let intensity = Math.min(combo, 10);

    document.body.style.transform = `translate(${intensity}px, ${intensity}px)`;

    setTimeout(()=>{
        document.body.style.transform = "translate(0,0)";
    }, 70);
}

/* PARTICLES (IMPROVED) */
function particle(x,y,text){
    let p = document.createElement("div");
    p.className = "particle";
    p.innerText = text;
    p.style.left = x + "px";
    p.style.top = y + "px";
    p.style.fontSize = (16 + combo) + "px";

    document.body.appendChild(p);
    setTimeout(()=>p.remove(),600);
}

/* TRAIN */
function train(e){
    if(e) e.preventDefault();

    let now = Date.now();

    if(now - lastClick < 600){
        combo++;
    } else {
        combo = 1;
    }

    lastClick = now;

    let gain = 1 + Math.floor(combo / 3);

    power += gain;
    boss -= gain;

    if(boss <= 0){
        boss = 100;
        alert("BOSS DOWN 💀🔥");
    }

    particle(e.clientX, e.clientY, "💥+" + gain);
    shake();

    document.getElementById("hit").currentTime = 0;
    document.getElementById("hit").play();

    update();
}

/* INIT */
update();

</script>

</body>
</html>
