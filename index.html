<!DOCTYPE html>
<html>
<head>
<title>Neon Gym RPG EVOLUTION</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0a0a0a, #000);
    color: white;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
}

.top {
    position: fixed;
    top: 0;
    width: 100%;
    background: rgba(0,0,0,0.85);
    text-align: center;
    padding: 10px;
    border-bottom: 2px solid #ffcc00;
    z-index: 100;
}

.card {
    width: 360px;
    margin: 20px auto;
    padding: 15px;
    background: rgba(255,255,255,0.05);
    border-radius: 15px;
    border: 1px solid #333;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
}

button:active {
    transform: scale(0.95);
}

.particle {
    position: absolute;
    pointer-events: none;
    animation: floatUp 0.6s forwards;
}

@keyframes floatUp {
    from {transform: translateY(0); opacity:1;}
    to {transform: translateY(-120px); opacity:0;}
}

.bar {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 10px;
}

.fill {
    height: 100%;
    width: 100%;
    background: linear-gradient(90deg,#ff3b3b,#ffcc00);
}
</style>
</head>

<body>

<div class="top">
💪 POWER: <span id="power">0</span> |
⚡ DMG: <span id="dmg">1</span> |
💰 GOLD: <span id="gold">0</span> |
🏆 LVL: <span id="level">1</span>
</div>

<br><br><br>

<div class="card">
<h2>🏋️ TRENING</h2>
<button onclick="train(event)">KLIK 💥</button>
</div>

<div class="card">
<h2>🧟 BOSS</h2>
<div class="bar"><div class="fill" id="bossBar"></div></div>
<p id="bossText"></p>
</div>

<div class="card">
<h2>⚡ SKILL SHOP</h2>
<button onclick="upgrade()">+1 DMG (10💰)</button>
</div>

<div class="card">
<h2>🏆 ACHIEVEMENTS</h2>
<p id="ach">Brak</p>
</div>

<audio id="hit" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5b8c2a7f4a.mp3"></audio>

<script>

/* STATE */
let power = 0;
let dmg = 1;
let gold = 0;
let level = 1;

let combo = 0;
let lastClick = 0;

let boss = {name:"Slime", hp:60, max:60};

let achievements = [];

/* UPDATE */
function update(){

document.getElementById("power").innerText = power;
document.getElementById("dmg").innerText = dmg;
document.getElementById("gold").innerText = gold;
document.getElementById("level").innerText = level;

document.getElementById("bossText").innerText =
boss.name + " HP: " + boss.hp;

document.getElementById("bossBar").style.width =
(boss.hp / boss.max) * 100 + "%";

document.getElementById("ach").innerText =
achievements.length ? achievements.join(", ") : "Brak";

}

/* PARTICLES */
function particle(x,y,text){
let p = document.createElement("div");
p.className="particle";
p.innerText=text;
p.style.left=x+"px";
p.style.top=y+"px";
document.body.appendChild(p);
setTimeout(()=>p.remove(),600);
}

/* BOSS SYSTEM */
function nextBoss(){

let bosses = [
{name:"Slime",hp:60},
{name:"Gym Goblin",hp:150},
{name:"Iron Beast",hp:300}
];

let b = bosses[Math.floor(Math.random()*bosses.length)];

boss = {name:b.name, hp:b.hp, max:b.hp};

gold += 5;
level++;

}

/* ACHIEVEMENTS */
function check(){

if(power>=50 && !achievements.includes("💪 Starter")){
achievements.push("💪 Starter");
}

if(level>=3 && !achievements.includes("👑 Grinder")){
achievements.push("👑 Grinder");
}

}

/* TRAIN */
function train(e){

let now = Date.now();

if(now-lastClick<500) combo++;
else combo=1;

lastClick=now;

let gain = dmg + Math.floor(combo/3);

power += gain;
boss.hp -= gain;

gold += 1;

if(combo>=10){
gain*=2;
particle(e.clientX,e.clientY,"🔥 ULTIMATE!");
}

document.getElementById("hit").currentTime=0;
document.getElementById("hit").play();

particle(e.clientX,e.clientY,"💥+"+gain);

if(boss.hp<=0) nextBoss();

check();
update();

}

/* UPGRADE */
function upgrade(){
if(gold>=10){
gold-=10;
dmg++;
}
update();
}

/* INIT */
update();

</script>

</body>
</html>
