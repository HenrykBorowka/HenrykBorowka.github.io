<!DOCTYPE html>
<html>
<head>
<title>Neon Gym Overload</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: radial-gradient(circle at top, #0f0f0f, #000);
    color: white;
    overflow-x: hidden;
}

/* MENU */
.menu {
    position: fixed;
    top: 0;
    width: 100%;
    display: flex;
    justify-content: center;
    gap: 15px;
    padding: 12px;
    background: rgba(0,0,0,0.9);
    border-bottom: 2px solid #ffcc00;
    z-index: 100;
}

.menu button {
    background: none;
    border: none;
    color: #ffcc00;
    font-weight: bold;
    cursor: pointer;
}

.menu button:hover {
    color: #ff3b3b;
}

/* PAGES */
.page {
    display: none;
    padding-top: 80px;
    text-align: center;
    min-height: 100vh;
}

.active { display: block; }

/* CARDS */
.card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,204,0,0.3);
    width: 340px;
    margin: 20px auto;
    padding: 20px;
    border-radius: 15px;
    box-shadow: 0 0 20px rgba(255,0,0,0.15);
    transition: 0.2s;
}

.card:hover {
    transform: scale(1.02);
}

/* BUTTONS */
.btn {
    padding: 12px 20px;
    border: none;
    border-radius: 10px;
    font-weight: bold;
    cursor: pointer;
    background: linear-gradient(90deg, #ff3b3b, #ffcc00);
    margin: 5px;
    transition: 0.2s;
}

.btn:hover {
    transform: scale(1.1);
}

/* NEON TEXT */
.neon {
    color: #ffcc00;
    text-shadow: 0 0 10px #ff3b3b, 0 0 20px #ffcc00;
}

/* XP BAR */
.bar {
    width: 100%;
    height: 12px;
    background: #222;
    border-radius: 10px;
    overflow: hidden;
}

.fill {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #ff3b3b, #ffcc00);
    transition: 0.3s;
}

/* FLOAT ANIMATION */
@keyframes float {
    0% { transform: translateY(0px); }
    50% { transform: translateY(-5px); }
    100% { transform: translateY(0px); }
}
</style>
</head>

<body>

<!-- MENU -->
<div class="menu">
    <button onclick="show('home')">Start</button>
    <button onclick="show('game')">Gra</button>
    <button onclick="show('shop')">Sklep</button>
    <button onclick="show('info')">Info</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
    <h1 class="neon">🏋️ NEON GYM OVERLOAD</h1>

    <div class="card">
        <p>Stwórz swojego koksa 💀💪</p>
    </div>

    <div class="card">
        <p>Level: <span id="level">1</span></p>
        <div class="bar"><div class="fill" id="xpbar"></div></div>
    </div>
</div>

<!-- GAME -->
<div id="game" class="page">

    <h1 class="neon">💪 TRENING</h1>

    <div class="card">
        <h2>Siła: <span id="power">0</span></h2>
        <button class="btn" onclick="train()">Trenuj 🔥</button>
        <p>+<span id="perClick">1</span> / klik</p>
    </div>

    <div class="card">
        <h3>AFK: <span id="auto">0</span>/s</h3>
    </div>
</div>

<!-- SHOP -->
<div id="shop" class="page">

    <h1 class="neon">🛒 SKLEP</h1>

    <div class="card">
        <button class="btn" onclick="buyClick()">
            Hantle (+1 klik) - <span id="cost">10</span>
        </button>
    </div>

    <div class="card">
        <button class="btn" onclick="buyAuto()">
            Trener AFK (+1/s) - <span id="autocost">50</span>
        </button>
    </div>

    <div class="card">
        <button class="btn" onclick="prestige()">
            PRESTIGE 🔥 reset + boost
        </button>
    </div>

</div>

<!-- INFO -->
<div id="info" class="page">

    <h1 class="neon">ℹ️ INFO</h1>

    <div class="card">
        <p>Idle Gym Overload Edition</p>
        <p>XP + Level + AFK + Prestige</p>
        <p>Local save + system upgrade</p>
    </div>

</div>

<script>

/* STATE */
let power = 0;
let perClick = 1;
let cost = 10;

let auto = 0;
let autoCost = 50;

let xp = 0;
let level = 1;

/* LOAD */
let save = JSON.parse(localStorage.getItem("gymX"));
if(save){
    Object.assign(window, save);
}

/* SAVE */
function saveGame(){
    localStorage.setItem("gymX", JSON.stringify({
        power, perClick, cost, auto, autoCost, xp, level
    }));
}

/* NAV */
function show(id){
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
}

/* UPDATE */
function update(){
    document.getElementById("power").innerText = power;
    document.getElementById("perClick").innerText = perClick;
    document.getElementById("cost").innerText = cost;
    document.getElementById("autocost").innerText = autoCost;
    document.getElementById("level").innerText = level;
    document.getElementById("auto").innerText = auto;

    let percent = (xp / (level * 60)) * 100;
    document.getElementById("xpbar").style.width = percent + "%";
}

/* XP */
function addXP(val){
    xp += val;
    if(xp >= level * 60){
        xp = 0;
        level++;
        perClick++;
        alert("LEVEL UP 💀🔥");
    }
}

/* ACTIONS */
function train(){
    power += perClick;
    addXP(perClick);
    update();
    saveGame();
}

function buyClick(){
    if(power >= cost){
        power -= cost;
        perClick++;
        cost = Math.floor(cost * 1.6);
        update();
        saveGame();
    }
}

function buyAuto(){
    if(power >= autoCost){
        power -= autoCost;
        auto++;
        autoCost = Math.floor(autoCost * 1.7);
        update();
        saveGame();
    }
}

/* PRESTIGE */
function prestige(){
    if(level >= 5){
        power = 0;
        perClick = 1;
        cost = 10;
        auto = 0;
        autoCost = 50;
        xp = 0;
        level = 1;

        alert("PRESTIGE COMPLETE 🔥 BONUS START");

        perClick = 2; // bonus start
        update();
        saveGame();
    } else {
        alert("Musisz mieć min level 5 💀");
    }
}

/* LOOP */
setInterval(()=>{
    if(auto > 0){
        power += auto;
        addXP(auto);
        update();
        saveGame();
    }
}, 1000);

/* INIT */
update();

</script>

</body>
</html>
